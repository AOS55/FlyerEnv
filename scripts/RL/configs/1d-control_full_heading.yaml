# Control heading task using the full aircraft model

defaults:
  - env: control_heading # Start with heading control base
  - agent: sac
  - callbacks: default
  - hydra: default
  - _self_

# Experiment-specific settings
project_name: FlyerRL
run_name: ControlFullHeading
total_timesteps: 1500000 # May need more steps for full physics
seed: 42

# Environment overrides (Modify control_heading defaults)
env:
  params:
    render_mode: rgb_array
    use_full_aircraft: true # CRITICAL: Switch to full physics
    # Add appropriate trim conditions for full physics heading control
    trim_condition_params:
      type: "StraightAndLevel" # Start in stable flight
      airspeed: 80.0 # Example airspeed
    # Optionally adjust target/tolerance/deviation for full physics if needed
    # target_value: 1.5
    # tolerance: 0.08
    # start_deviation: 0.4
    # max_episode_steps: 1500 # Optionally increase episode length

# Agent overrides (Optional: Tune for full physics if necessary)
# agent:
#   learning_rate: 0.0002
#   buffer_size: 1500000

# Global settings
use_wandb: True
resume_training: False
