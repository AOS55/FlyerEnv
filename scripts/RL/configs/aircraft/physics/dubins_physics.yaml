# Dubins aircraft physics parameters
physics_type: "dubins"

# Performance limits
max_speed: 200.0 # Maximum airspeed (m/s)
min_speed: 15.0 # Minimum airspeed (m/s)
acceleration: 5.0 # Maximum acceleration (m/s²)
