# Goal environment configuration
defaults:
  - /common/physics: dubins_physics # Default to Dubins physics model

# Environment identifier
name: flyer_goal-v1

# Parameters directly matching GoalFlyerEnv.__init__ parameters
params:
  # Common parameters from global config
  max_episode_steps: ${max_episode_steps}
  time_step: ${time_step}
  normalize_observations: ${normalize_observations}
  normalize_actions: ${normalize_actions}
  render_mode: ${render_mode}
  seed: ${seed}

  # Goal-specific parameters
  goal_distance_range: [500.0, 2000.0] # Min/max distance for goal placement
  goal_altitude_range_agl: [200.0, 1000.0] # Min/max goal altitude (AGL)
  goal_heading_range_rad: [0.0, 6.28318] # Min/max heading (0-2π radians)
  goal_tolerance: 50.0 # Distance threshold for goal achievement
  reward_type: "Dense" # Reward type (Dense or Sparse)

  # Start position parameters
  start_position: [0.0, 0.0, -500.0] # Fixed start position (x, y, z in NED)
  use_full_aircraft: false # Use Dubins model for simplicity
