# Trajectory environment configuration
defaults:
  - /common/physics: dubins_physics # Default to Dubins physics model

# Environment identifier
name: flyer_trajectory-v1

# Parameters directly matching TrajectoryFlyerEnv.__init__ parameters
params:
  # Common parameters from global config
  max_episode_steps: ${max_episode_steps}
  time_step: ${time_step}
  normalize_observations: ${normalize_observations}
  normalize_actions: ${normalize_actions}
  render_mode: ${render_mode}
  seed: ${seed}

  # Trajectory-specific parameters
  motion_type: "straight_and_level" # Type of motion primitive
  target_velocity: 30.0 # Desired airspeed (m/s)

  # Motion-specific parameters based on motion_type
  motion_params:
    target_distance: 1000.0 # For straight_and_level
    # For coordinated_turn (when motion_type is changed):
    # turn_radius: 200.0
    # turn_angle: 90.0
    # direction: "Right"

  # Start position parameters
  start_position: [0.0, 0.0, -100.0] # Fixed start position (x, y, z in NED)
  start_heading_deg: 0.0 # Fixed starting heading (degrees)
  use_full_aircraft: false # Use Dubins model for simplicity
