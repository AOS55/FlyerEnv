# Environment Properties for Full Aircraft (Twin Otter) - Altitude Control

# --- Key change to enable the full model ---
use_full_aircraft: True # This parameter is used by the ControlFlyerEnv constructor

# --- Task Parameters (Adjust as needed for Twin Otter) ---
control_type: "altitude"
target_value: 3000.0
tolerance: 50.0
start_deviation: 200.0
# --- Add Trim Condition for Full Model ---
# This tells the environment to try and start the aircraft in a trimmed state
# trim_condition_params:
#   type: "StraightAndLevel" # Or "SteadyClimb", "CoordinatedTurn"
#   airspeed: 80.0 # Target airspeed for trimming (m/s)
#   # gamma_deg: 3.0 # Required for SteadyClimb (degrees)
#   # bank_angle_deg: 15.0 # Required for CoordinatedTurn (degrees)

