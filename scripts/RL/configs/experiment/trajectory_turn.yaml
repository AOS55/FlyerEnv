# Coordinated turn trajectory experiment
project_name: FlyerRL_TrajectoryTurn
total_timesteps: 1000000

# --- Environment config overrides ---
env:
  name: flyer_trajectory-v1 # Use trajectory environment

  params:
    motion_type: "coordinated_turn" # Perform coordinated turn
    target_velocity: 40.0 # Higher velocity

    # Turn-specific parameters
    motion_params:
      turn_radius: 200.0 # Turn radius (m)
      turn_angle: 90.0 # 90-degree turn (degrees)
      direction: "Right" # Turn direction

    start_position: [0.0, 0.0, -200.0] # Start at 200m altitude
    start_heading_deg: 180.0 # Start heading south
    max_episode_steps: 1200 # Longer episodes

# --- Agent config overrides ---
agent:
  learning_rate: 0.0001
  gamma: 0.99
  buffer_size: 500000 # Smaller buffer size
