project_name: FlyerRL_TrajectoryTurnFull
total_timesteps: 2000000 # Might need more steps

env:
  name: flyer_trajectory-v1
  defaults:
    - /common/physics: full_twin_otter # Choose full physics
  params:
    use_full_aircraft: true # Ensure consistency
    motion_type: "coordinated_turn"
    target_velocity: 40.0
    motion_params:
      turn_radius: 250.0 # Maybe adjust for different physics
      turn_angle: 90.0
      direction: "Left"
    # Add trim condition if helpful for full physics start
    trim_condition_params:
      type: "StraightAndLevel"
      airspeed: 40.0

agent: # Might need tuning for full physics control
  learning_rate: 0.0001
  batch_size: 1024
